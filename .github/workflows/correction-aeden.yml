name: Correction technique Aeden
on:
  push:
    branches: [main]
    paths: ['.github/workflows/correction-aeden.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.event.before == '1365d0999eb08c727033c14a7a7553caa11bae70'
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - name: Corriger les identifiants et le format des soldes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json, yaml, hashlib
          from decimal import Decimal
          root = Path('Mes aventures RPG/Aeden')
          docs = []
          used = set()
          for p in sorted(root.rglob('*.md')):
              raw = p.read_bytes()
              s = raw.decode('utf-8')
              m = re.match(r'\A---\s*\n(.*?)\n---\s*\n', s, re.S)
              if not m:
                  continue
              d = yaml.safe_load(m.group(1))
              docs.append((p,s,m,d))
              if d.get('id'):
                  used.add(d['id'])
          changes = []
          for p,s,m,d in docs:
              if d.get('statut_documentaire') != 'valide' or d.get('id') is not None:
                  continue
              rel = p.relative_to(root).as_posix()
              ident = 'DOC-AED-' + hashlib.sha256(rel.encode()).hexdigest()[:12].upper()
              assert ident not in used
              used.add(ident)
              new, n = re.subn(r'^id: null[ \t]*$', 'id: '+ident, m.group(1), flags=re.M)
              assert n == 1
              new, n = re.subn(r'^version: (\d+)[ \t]*$', lambda z: 'version: '+str(int(z.group(1))+1), new, flags=re.M)
              assert n == 1
              p.write_bytes((s[:m.start(1)]+new+s[m.end(1):]).encode('utf-8'))
              changes.append((rel,ident))
              print(f'ID ajouté : {rel} -> {ident}')
          assert len(changes) == 10, 'Nombre de fiches différent du diagnostic'
          p = root/'05 — Inventaire et finances/Données/finances.json'
          f = json.loads(p.read_text(encoding='utf-8'))
          assert len(f['comptes']) == 1 and not f['transactions']
          c = f['comptes'][0]
          assert c['id']=='COMPTE-AED-001' and c['solde_initial']==c['solde_actuel']==350000
          note = (root/'05 — Inventaire et finances/Comptabilité personnelle.md').read_text(encoding='utf-8')
          assert 'Solde initial validé :** 350 000 P' in note and 'Dernier solde vérifié :** 350 000 P' in note
          for key in ('solde_initial','solde_actuel'):
              c[key] = str(Decimal(c[key]))
          p.write_text(json.dumps(f,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Soldes initial et actuel : 350000 (chaînes décimales), aucune transaction créée.')
          p=root/'18 — Contrôle de cohérence/Registre des anomalies.md'
          s=p.read_text(encoding='utf-8')
          s=s.replace('version: 1\n','version: 2\n',1)
          marker='| --- | --- | --- | --- | --- | --- | --- | --- |\n'
          assert marker in s
          rows=[]
          for i,(rel,ident) in enumerate(changes,1):
              rows.append(f'| ANOM-AED-{i:03} | 2026-11-24 | Métadonnées | Fiche validée sans ID | {rel} | Technique | Correction autorisée par le joueur | ID stable {ident} attribué ; canon inchangé |')
          rows.append('| ANOM-AED-011 | 2026-11-24 | Finances | Soldes JSON numériques au lieu de chaînes décimales | finances.json et Comptabilité personnelle | Technique | Correction autorisée par le joueur | 350 000 P conservées ; format corrigé ; aucune transaction |')
          s=s.replace(marker,marker+'\n'.join(rows)+'\n',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Tester et auditer avant le commit
        run: |
          python "Mes aventures RPG/Aeden/18 — Contrôle de cohérence/test_audit.py"
          python "Mes aventures RPG/Aeden/18 — Contrôle de cohérence/audit.py"
      - name: Enregistrer uniquement les corrections vérifiées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Mes aventures RPG/Aeden"
          git commit -m "Aeden : corriger les 11 anomalies documentaires"
          git push origin HEAD:main
