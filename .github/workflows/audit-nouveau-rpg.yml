name: Audit RPG - nouvelle campagne
on:
  push:
    branches: [main]
    paths:
      - 'Mes aventures RPG/Aeden/**'
      - '.github/workflows/audit-nouveau-rpg.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.2
      - run: python "Mes aventures RPG/Aeden/18 — Contrôle de cohérence/test_audit.py"
      - run: python "Mes aventures RPG/Aeden/18 — Contrôle de cohérence/audit.py"
